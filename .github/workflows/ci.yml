name: CI — Build APK & Deploy Web

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Validasi dataset referensi & konsistensi data yang dibangkitkan
  validate-data:
    name: Validasi data referensi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek konsistensi app/js/data.js dengan data/tiktok-reference.json
        run: node tools/build-data.js --check

  # 2) Build APK Android via Gradle (wrapper WebView)
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Salin aplikasi web ke Android assets
        run: bash android/copy-assets.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK debug
        run: cd android && gradle assembleDebug --no-daemon --stacktrace

      - name: Build APK release (minified)
        run: cd android && gradle assembleRelease --no-daemon || echo "release opsional, lanjut"

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLite-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3) Deploy aplikasi web ke GitHub Pages
  deploy-web:
    name: Deploy web (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
