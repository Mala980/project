<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TikTok Lite</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="phone">

  <!-- ============ FEED ============ -->
  <main id="feed"></main>

  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <div class="top-tabs">
      <button class="tab" data-tab="following">Mengikuti</button>
      <button class="tab active" data-tab="foryou">Untuk Anda</button>
    </div>
    <button id="btn-search" class="top-icon" aria-label="Cari">
      <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.7 4.7-1.4 1.4-4.7-4.7A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
    </button>
  </header>

  <!-- mute / unmute -->
  <button id="btn-mute" class="muted-badge" aria-label="Suara">
    <svg class="ic-muted" viewBox="0 0 24 24"><path d="M12 3 7 8H3v8h4l5 5V3Zm7.3 3.3 1.4 1.4L18.4 10l2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3 1.4-1.4 2.3 2.3 2.3-2.3Z"/></svg>
    <svg class="ic-unmuted" viewBox="0 0 24 24"><path d="M12 3 7 8H3v8h4l5 5V3Zm4.6 2.6a7 7 0 0 1 0 12.8l-1-1.7a5 5 0 0 0 0-9.4l1-1.7Zm2.8-2.9a10.4 10.4 0 0 1 0 18.6l-1-1.7a8.4 8.4 0 0 0 0-15.2l1-1.7Z"/></svg>
  </button>

  <!-- pause indicator -->
  <div id="pause-icon" hidden>
    <svg viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5v-15Z"/></svg>
  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="bottomnav">
    <button class="navbtn active" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M12 3.2 3 10v11h6.5v-6.5h5V21H21V10L12 3.2Z"/></svg>
      <span>Beranda</span>
    </button>
    <button class="navbtn" data-nav="friends">
      <svg viewBox="0 0 24 24"><path d="M9 11a3.5 3.5 0 1 0 0-7A3.5 3.5 0 0 0 9 11Zm0 2c-3.3 0-6 2.2-6 5v2h12v-2c0-2.8-2.7-5-6-5Zm8-2.2a3 3 0 1 0-2.1-5.2 5.4 5.4 0 0 1 0 4.6c.6.4 1.3.6 2.1.6Zm-.2 2.4c1.9.7 3.2 2.3 3.2 4.4V20h-3v-2c0-1.7-.5-3.2-1.4-4.4.4-.2.8-.3 1.2-.4Z"/></svg>
      <span>Teman</span>
    </button>
    <button id="btn-create" class="navbtn create" data-nav="create" aria-label="Buat video">
      <span class="c-red"></span><span class="c-cyan"></span><span class="c-body"><b>+</b></span>
    </button>
    <button class="navbtn" data-nav="inbox">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12h-4.5L12 19.5 8.5 16H4V4Zm2 2v8h3.3l2.7 2.3 2.7-2.3H18V6H6Z"/></svg>
      <span>Kotak Masuk</span>
    </button>
    <button class="navbtn" data-nav="profile">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2.5-7 6v1h14v-1c0-3.5-3-6-7-6Z"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- ============ COMMENTS SHEET ============ -->
  <div id="overlay"></div>
  <section id="comments-sheet" class="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span id="comments-title">0 komentar</span>
      <button id="btn-close-comments" aria-label="Tutup">
        <svg viewBox="0 0 24 24"><path d="m6 4.6 6 6 6-6L19.4 6l-6 6 6 6-1.4 1.4-6-6-6 6L4.6 18l6-6-6-6L6 4.6Z"/></svg>
      </button>
    </div>
    <div id="comments-list"></div>
    <div id="comment-input">
      <div class="me-avatar">S</div>
      <input id="comment-text" type="text" placeholder="Tambahkan komentar..." maxlength="150" autocomplete="off">
      <button id="comment-send" aria-label="Kirim">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-4.5 18-4.9-6.6L3 11.5Zm8.6 2.1 3 4L17 6.9 6.5 11.9l5.1 1.7Z"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ SHARE SHEET ============ -->
  <section id="share-sheet" class="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head center"><span>Bagikan ke</span></div>
    <div id="share-row"></div>
    <div class="sheet-cancel-wrap"><button id="btn-cancel-share">Batal</button></div>
  </section>

  <!-- toast -->
  <div id="toast"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
